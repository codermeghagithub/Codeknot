<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D6CEC4" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('learnloop_theme') || localStorage.getItem('codeknot_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>LearnLoop — Don't just get the answer. Actually understand it.</title>
    <meta name="title" content="LearnLoop — AI Coding Tutor with Concept Verification" />
    <meta name="description" content="LearnLoop stops passive copy-pasting with a 3-question formative assessment loop, personalized remedial paths, and PDF-grounded exams." />
    
    <!-- CodeKnot Favicon -->
    <link rel="icon" type="image/png" href="/codeknot-logo.png" />

    <!-- Google Fonts: Bricolage Grotesque (display), Instrument Serif (editorial italic), Geist (body), JetBrains Mono (code/mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-[#F25C05]/20 selection:text-[#F25C05] overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
